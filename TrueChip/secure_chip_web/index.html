<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrueChip Hardware Authenticator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-mono">
  <div class="max-w-4xl mx-auto space-y-6">
    <!-- Header -->
    <header class="border-b border-slate-700 pb-4 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold text-emerald-400">TRUECHIP AUTHENTICATOR</h1>
        <p class="text-sm text-slate-400">Web Serial API Direct Hardware Verification</p>
      </div>
      <div id="conn-status" class="px-3 py-1 rounded text-xs bg-rose-950 text-rose-300 border border-rose-800">
        UART Disconnected
      </div>
    </header>

    <!-- Control Panel -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="bg-slate-800 p-4 rounded border border-slate-700 space-y-3">
        <h2 class="text-sm font-semibold text-slate-300 uppercase">Cấu hình UART</h2>
        <div class="flex gap-2">
          <button id="btn-connect" class="flex-1 bg-blue-600 hover:bg-blue-500 py-2 rounded text-sm font-bold transition">
            Kết Nối Cổng COM
          </button>
          <button id="btn-disconnect" disabled class="bg-slate-700 disabled:opacity-50 py-2 px-4 rounded text-sm transition">
            Ngắt
          </button>
        </div>
      </div>

      <div class="bg-slate-800 p-4 rounded border border-slate-700 space-y-3">
        <h2 class="text-sm font-semibold text-slate-300 uppercase">Kịch bản Test</h2>
        <div class="flex gap-2">
          <button id="btn-test-auth" disabled class="flex-1 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 py-2 rounded text-sm font-bold transition">
            Quét Xác Thực Chip
          </button>
        </div>
      </div>
    </div>

    <!-- Verification Result -->
    <div id="result-box" class="hidden bg-slate-800 p-5 rounded border border-slate-700 space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="text-sm font-semibold text-slate-300 uppercase">Kết Quả Xác Thực</h2>
        <span id="badge-status" class="px-3 py-1 rounded text-sm font-bold"></span>
      </div>
      <div class="grid grid-cols-2 gap-2 text-sm bg-slate-900 p-3 rounded border border-slate-800">
        <div><span class="text-slate-400">UID:</span> <span id="res-uid" class="text-yellow-400"></span></div>
        <div><span class="text-slate-400">Sản phẩm:</span> <span id="res-product" class="text-slate-200"></span></div>
        <div><span class="text-slate-400">Nhà sản xuất:</span> <span id="res-mfg" class="text-slate-200"></span></div>
        <div><span class="text-slate-400">Ngày đóng gói:</span> <span id="res-date" class="text-slate-200"></span></div>
      </div>
    </div>

    <!-- Console Log -->
    <div class="bg-slate-950 p-4 rounded border border-slate-800 space-y-2">
      <div class="flex justify-between text-xs text-slate-400">
        <span>LOG GIAO TIẾP PHẦN CỨNG & CLOUD</span>
        <button id="btn-clear-log" class="hover:text-slate-200">Xóa log</button>
      </div>
      <div id="terminal-log" class="h-48 overflow-y-auto text-xs space-y-1 text-slate-300"></div>
    </div>
  </div>

  <script>
    const SERVER_URL = "https://truechip-server.onrender.com/verify";
    const MAGIC = 0xA5;
    const VERSION = 0x01;
    const CMD_GET_ID = 0x01;
    const CMD_CHALLENGE = 0x02;
    const STATUS_OK = 0x00;

    let port = null;
    let reader = null;
    let readerTask = null;
    let rxBuffer = new Uint8Array(0);
    let connecting = false;
    let authenticating = false;
    let disconnecting = false;

    const connectBtn = document.getElementById("btn-connect");
    const disconnectBtn = document.getElementById("btn-disconnect");
    const testBtn = document.getElementById("btn-test-auth");
    const statusEl = document.getElementById("conn-status");
    const logEl = document.getElementById("terminal-log");

    function appendLog(msg, type = "info") {
      const line = document.createElement("div");
      const time = new Date().toLocaleTimeString();
      const colors = {
        info: "text-slate-300",
        success: "text-emerald-400",
        error: "text-rose-400",
        warn: "text-yellow-400"
      };
      line.className = colors[type] || colors.info;
      line.textContent = `[${time}] ${msg}`;
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function delay(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function bytesToHex(bytes) {
      return Array.from(bytes)
        .map(byte => byte.toString(16).padStart(2, "0"))
        .join("")
        .toUpperCase();
    }

    function concatBytes(a, b) {
      const result = new Uint8Array(a.length + b.length);
      result.set(a);
      result.set(b, a.length);
      return result;
    }

    function crc16Ccitt(bytes) {
      let crc = 0xFFFF;
      for (const byte of bytes) {
        crc ^= byte << 8;
        for (let bit = 0; bit < 8; bit += 1) {
          crc = (crc & 0x8000)
            ? ((crc << 1) ^ 0x1021) & 0xFFFF
            : (crc << 1) & 0xFFFF;
        }
      }
      return crc;
    }

    // Protocol V2: A5 | VER | CMD | LEN | PAYLOAD | CRC_H | CRC_L.
    function buildRequest(command, payload = new Uint8Array(0)) {
      const body = new Uint8Array(3 + payload.length);
      body[0] = VERSION;
      body[1] = command;
      body[2] = payload.length;
      body.set(payload, 3);

      const crc = crc16Ccitt(body);
      const frame = new Uint8Array(1 + body.length + 2);
      frame[0] = MAGIC;
      frame.set(body, 1);
      frame[frame.length - 2] = (crc >> 8) & 0xFF;
      frame[frame.length - 1] = crc & 0xFF;
      return frame;
    }

    function isQuietPortError(error) {
      const name = error?.name || "";
      const message = String(error?.message || error || "").toLowerCase();
      return [
        "notfounderror",
        "invalidstateerror",
        "networkerror",
        "failed to open serial port",
        "device does not exist",
        "already open",
        "access is denied",
        "resource busy"
      ].some(value => name.toLowerCase() === value || message.includes(value));
    }

    function setStatus(connected) {
      if (connected) {
        statusEl.className = "px-3 py-1 rounded text-xs bg-emerald-950 text-emerald-300 border border-emerald-800";
        statusEl.textContent = "UART Connected @ 115200";
      } else {
        statusEl.className = "px-3 py-1 rounded text-xs bg-rose-950 text-rose-300 border border-rose-800";
        statusEl.textContent = "UART Disconnected";
      }
    }

    function updateButtons() {
      connectBtn.disabled = connecting || authenticating || Boolean(port);
      disconnectBtn.disabled = !port || connecting || authenticating;
      testBtn.disabled = !port || connecting || authenticating;
    }

    async function openPortWithRetry() {
      let lastError;
      for (let attempt = 0; attempt < 2; attempt += 1) {
        try {
          await port.open({ baudRate: 115200, dataBits: 8, stopBits: 1, parity: "none", flowControl: "none" });
          return;
        } catch (error) {
          lastError = error;
          if (!isQuietPortError(error) || attempt === 1) throw error;
          await delay(350);
        }
      }
      throw lastError || new Error("Không thể mở cổng UART.");
    }

    async function closePortSilently() {
      disconnecting = true;
      if (reader) {
        try { await reader.cancel(); } catch (_) {}
      }
      if (readerTask) {
        try { await readerTask; } catch (_) {}
      }
      if (reader) {
        try { reader.releaseLock(); } catch (_) {}
      }
      reader = null;
      readerTask = null;
      if (port) {
        try { await port.close(); } catch (_) {}
      }
      port = null;
      rxBuffer = new Uint8Array(0);
      disconnecting = false;
    }

    function startReaderLoop() {
      reader = port.readable.getReader();
      readerTask = (async () => {
        try {
          while (!disconnecting) {
            const { value, done } = await reader.read();
            if (done) break;
            if (value?.length) rxBuffer = concatBytes(rxBuffer, value);
          }
        } catch (error) {
          if (!disconnecting && !isQuietPortError(error)) {
            appendLog(`Lỗi đọc UART: ${error.message}`, "error");
          }
        }
      })();
    }

    // Mỗi lần ghi tự lấy và nhả writer; không giữ writer sau khi xác thực.
    async function writeFrame(frame) {
      if (!port?.writable) throw new Error("Cổng UART chưa sẵn sàng để ghi.");
      const frameWriter = port.writable.getWriter();
      try {
        await frameWriter.write(frame);
      } finally {
        frameWriter.releaseLock();
      }
    }

    async function readResponseFrame(timeoutMs = 4000) {
      const startedAt = Date.now();
      while (Date.now() - startedAt < timeoutMs) {
        const magicIndex = rxBuffer.indexOf(MAGIC);
        if (magicIndex > 0) rxBuffer = rxBuffer.slice(magicIndex);
        if (magicIndex === -1) rxBuffer = new Uint8Array(0);

        if (rxBuffer.length >= 4) {
          const payloadLength = rxBuffer[3];
          const frameLength = 4 + payloadLength;
          if (rxBuffer.length >= frameLength) {
            const frame = rxBuffer.slice(0, frameLength);
            rxBuffer = rxBuffer.slice(frameLength);
            if (frame[1] !== VERSION) throw new Error(`Sai phiên bản Protocol V2: 0x${frame[1].toString(16)}`);
            return { status: frame[2], payload: frame.slice(4) };
          }
        }
        await delay(10);
      }
      throw new Error("Timeout chờ phản hồi từ FPGA.");
    }

    async function sendCommand(command, payload = new Uint8Array(0)) {
      await writeFrame(buildRequest(command, payload));
      return readResponseFrame();
    }

    connectBtn.addEventListener("click", async () => {
      if (!navigator.serial) {
        appendLog("Trình duyệt không hỗ trợ Web Serial. Hãy dùng Chrome hoặc Edge trên HTTPS.", "error");
        return;
      }

      connecting = true;
      updateButtons();
      try {
        port = await navigator.serial.requestPort();
        await openPortWithRetry();
        rxBuffer = new Uint8Array(0);
        startReaderLoop();
        setStatus(true);
        appendLog("Đã mở cổng COM thành công ở 115200 8N1.", "success");
      } catch (error) {
        await closePortSilently();
        setStatus(false);
        // Người dùng hủy chọn cổng hoặc Windows cần thêm một nhịp để nhận COM
        // không phải lỗi giao tiếp, nên không ghi các lỗi tạm thời vào log.
        if (!isQuietPortError(error)) appendLog(`Không thể mở cổng COM: ${error.message}`, "error");
      } finally {
        connecting = false;
        updateButtons();
      }
    });

    disconnectBtn.addEventListener("click", async () => {
      if (authenticating) return;
      await closePortSilently();
      setStatus(false);
      updateButtons();
      appendLog("Đã ngắt kết nối cổng COM.", "warn");
    });

    testBtn.addEventListener("click", async () => {
      if (!port || authenticating) return;
      authenticating = true;
      updateButtons();
      try {
        appendLog("--- Bắt đầu chu trình xác thực Protocol V2 ---");
        rxBuffer = new Uint8Array(0);

        appendLog("Đang gửi frame GET_ID (A5 01 01 00 CRC)...");
        const idResponse = await sendCommand(CMD_GET_ID);
        if (idResponse.status !== STATUS_OK || idResponse.payload.length !== 16) {
          throw new Error(`GET_ID bị từ chối hoặc UID không đủ 16 bytes (status 0x${idResponse.status.toString(16).padStart(2, "0")})`);
        }
        const uidHex = bytesToHex(idResponse.payload);
        appendLog(`UID phản hồi từ FPGA: ${uidHex}`);

        const nonce = new Uint8Array(16);
        crypto.getRandomValues(nonce);
        const nonceHex = bytesToHex(nonce);
        appendLog(`Nonce ngẫu nhiên: ${nonceHex}`);

        appendLog("Đang gửi frame CHALLENGE (A5 01 02 10 nonce CRC)...");
        const challengeResponse = await sendCommand(CMD_CHALLENGE, nonce);
        if (challengeResponse.status !== STATUS_OK || challengeResponse.payload.length !== 16) {
          throw new Error(`CHALLENGE bị từ chối hoặc AES response không đủ 16 bytes (status 0x${challengeResponse.status.toString(16).padStart(2, "0")})`);
        }
        const responseHex = bytesToHex(challengeResponse.payload);
        appendLog(`AES Response từ FPGA: ${responseHex}`);

        appendLog("Gửi payload lên Cloud Server xác thực...");
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 45000);
        let serverResponse;
        try {
          serverResponse = await fetch(SERVER_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ uid: uidHex, nonce: nonceHex, response: responseHex }),
            signal: controller.signal
          });
        } finally {
          clearTimeout(timeout);
        }
        if (!serverResponse.ok) throw new Error(`Cloud Server trả HTTP ${serverResponse.status}`);
        const data = await serverResponse.json();
        const resultBox = document.getElementById("result-box");
        const badge = document.getElementById("badge-status");
        resultBox.classList.remove("hidden");
        document.getElementById("res-uid").textContent = uidHex;

        if (data.status === "authentic" || data.authentic === true || data.valid === true) {
          badge.className = "px-3 py-1 rounded text-sm font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500";
          badge.textContent = "AUTHENTIC / HÀNG THẬT";
          document.getElementById("res-product").textContent = data.product || "TrueChip v7.2 FPGA Demo";
          document.getElementById("res-mfg").textContent = data.manufacturer || "Huy Le Corp";
          document.getElementById("res-date").textContent = data.pack_date || "28/08/2026";
          appendLog("KẾT QUẢ: AUTHENTIC / HÀNG THẬT", "success");
        } else {
          badge.className = "px-3 py-1 rounded text-sm font-bold bg-rose-500/20 text-rose-300 border border-rose-500";
          badge.textContent = "FAKE / TỪ CHỐI";
          document.getElementById("res-product").textContent = "Không xác định";
          document.getElementById("res-mfg").textContent = "Không xác định";
          document.getElementById("res-date").textContent = data.reason || "N/A";
          appendLog(`KẾT QUẢ: ${data.message || data.reason || "Lệch mã hóa AES"}`, "error");
        }
      } catch (error) {
        appendLog(`Lỗi thực thi: ${error.name === "AbortError" ? "Cloud Server phản hồi quá lâu (45 giây)." : error.message}`, "error");
      } finally {
        authenticating = false;
        updateButtons();
      }
    });

    if (navigator.serial) {
      navigator.serial.addEventListener("disconnect", async event => {
        if (event.target === port && !authenticating) {
          await closePortSilently();
          setStatus(false);
          updateButtons();
          appendLog("Thiết bị UART đã bị ngắt khỏi máy tính.", "warn");
        }
      });
    }

    document.getElementById("btn-clear-log").addEventListener("click", () => {
      logEl.innerHTML = "";
    });
    updateButtons();
  </script>
</body>
</html>
