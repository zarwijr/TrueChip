<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TrueChip - Local Enrollment</title>
  <style>
    :root { font-family: Segoe UI, Arial, sans-serif; color: #172033; background: #eef2f7; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { width: min(560px, calc(100% - 32px)); background: white; padding: 28px; border-radius: 14px; box-shadow: 0 8px 30px #192b451c; }
    h1 { margin: 0 0 6px; font-size: 23px; }
    .warning { color: #8a1c1c; font-size: 13px; margin: 0 0 20px; }
    .status { font-size: 13px; margin: 10px 0 18px; }
    .ok { color: #176b3a; } .bad { color: #a12626; }
    label { display: block; font-weight: 600; font-size: 14px; margin: 13px 0 5px; }
    input { box-sizing: border-box; width: 100%; padding: 10px; border: 1px solid #bbc5d4; border-radius: 7px; font-size: 14px; }
    button { margin-top: 20px; padding: 11px 18px; border: 0; border-radius: 7px; background: #165dcc; color: white; font-weight: 700; cursor: pointer; }
    button:disabled { background: #93a5c2; cursor: wait; }
    #result { white-space: pre-wrap; margin-top: 16px; font-size: 14px; }
  </style>
</head>
<body>
<main>
  <h1>TRUECHIP ENROLLMENT</h1>
  <p class="warning">Chỉ dùng trên máy quản trị. Không mở cổng này ra Internet.</p>
  <div id="db-status" class="status">Đang kiểm tra cấu hình...</div>

  <form id="enroll-form">
    <label for="uid">UID / PUF ID (32 ký tự Hex)</label>
    <input id="uid" name="uid" maxlength="32" required autocomplete="off" spellcheck="false">

    <label for="secret_key">Secret key (32 ký tự Hex)</label>
    <input id="secret_key" name="secret_key" type="password" maxlength="32" required autocomplete="new-password" spellcheck="false">

    <label for="product">Product</label>
    <input id="product" name="product" value="TrueChip V2" maxlength="255" required>

    <label for="manufacturer">Manufacturer</label>
    <input id="manufacturer" name="manufacturer" value="Huy Le Corp" maxlength="255" required>

    <label for="pack_date">Pack date (DD/MM/YYYY)</label>
    <input id="pack_date" name="pack_date" required>

    <button id="submit" type="submit">Enroll chip</button>
  </form>
  <div id="result" role="status"></div>
</main>
<script>
  const statusBox = document.getElementById('db-status');
  const resultBox = document.getElementById('result');
  const submit = document.getElementById('submit');
  document.getElementById('pack_date').value = new Intl.DateTimeFormat('en-GB').format(new Date());

  fetch('/api/status').then(r => r.json()).then(data => {
    statusBox.textContent = data.database_configured
      ? 'Database URL: đã cấu hình (không hiển thị giá trị)'
      : 'Database URL: chưa cấu hình trong admin_config.json';
    statusBox.className = data.database_configured ? 'status ok' : 'status bad';
  }).catch(() => {
    statusBox.textContent = 'Không đọc được trạng thái backend.';
    statusBox.className = 'status bad';
  });

  document.getElementById('enroll-form').addEventListener('submit', async event => {
    event.preventDefault();
    submit.disabled = true;
    resultBox.textContent = 'Đang ghi danh...';
    const form = new FormData(event.target);
    const payload = Object.fromEntries(form.entries());
    try {
      const response = await fetch('/api/enroll', {
        method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)
      });
      const data = await response.json();
      resultBox.textContent = data.message || 'Đã hoàn tất.';
      resultBox.className = response.ok ? 'ok' : 'bad';
      if (response.ok) document.getElementById('secret_key').value = '';
    } catch (error) {
      resultBox.textContent = 'Không kết nối được backend cục bộ.';
      resultBox.className = 'bad';
    } finally { submit.disabled = false; }
  });
</script>
</body>
</html>
